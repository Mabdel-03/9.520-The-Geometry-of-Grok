research_questions:
  - "Does real Muon grok faster than AdamW across all datasets?"
  - "How does weight decay affect time-to-grok for each optimizer?"
  - "Are patterns consistent across algorithmic, visual, and reasoning tasks?"
  - "Does architecture (ReLU vs Softmax) affect optimizer effectiveness?"

