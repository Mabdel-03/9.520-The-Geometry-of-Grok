# Complete Experimental Matrix for Optimizer Comparison Across 3 Datasets

experiments:
  
  # Dataset 1: Modular Arithmetic - Softmax Transformer (NEW)
  modular_softmax:
    description: "Modular addition with standard softmax transformer (Muon-compatible)"
    task: "(a + b) mod 97"
    architecture: "Standard Transformer (softmax, LayerNorm)"
    optimizers: [adamw, muon, sgd]
    weight_decays: [0.0, 0.01, 0.1, 0.5, 1.0, 2.0, 5.0]
    learning_rates:
      adamw: 1e-3
      muon: 1e-3   # As in Tveit paper
      sgd: 1e-2    # 10x higher
    epochs: 50000
    expected_grokking: "100-1000 epochs"
    total_experiments: 21
    
  # Dataset 2: MNIST - 3-Layer MLP (RUNNING - corrected)
  mnist:
    description: "MNIST digit classification with MSE loss (Omnigrok)"
    task: "Digit classification, 1000 training samples"
    architecture: "3-Layer MLP (784→200→200→10)"
    optimizers: [adamw, muon, sgd]
    weight_decays: [0.0, 0.001, 0.01, 0.05, 0.1, 0.5, 1.0]
    learning_rates:
      adamw: 1e-3
      muon: 5e-3   # May need higher for MLP
      sgd: 1e-2
    steps: 100000
    loss: "MSE with one-hot targets"
    dtype: "float64"
    expected_grokking: "10k-50k steps"
    total_experiments: 21
    status: "18 currently running"
    
  # Dataset 3: Compositional Reasoning - GPT-2 (NEW)
  composition:
    description: "Two-hop knowledge graph reasoning (Wang et al.)"
    task: "A→B, B→C ⇒ A→C composition"
    architecture: "GPT-2 (4-layer, 768-dim)"
    optimizers: [adamw, muon, sgd]
    weight_decays: [0.0, 0.01, 0.05, 0.1, 0.2, 0.5, 1.0]
    learning_rates:
      adamw: 1e-4  # Wang paper value
      muon: 1e-4   # Match AdamW for transformers
      sgd: 1e-3    # 10x higher
    steps: 150000
    expected_grokking: "50k-150k steps (Wang paper: 100k)"
    total_experiments: 21

# Summary
total_datasets: 3
total_optimizers: 3
total_new_experiments: 63  # 21 softmax + 21 MNIST (rerun with real Muon) + 21 composition
total_complete: 24  # Nanda ReLU (baseline)
grand_total: 87

