# Weight Decay Sweep Configuration
# Define different weight decay values to test for each optimizer

# Weight decay values to test (inspired by grokking literature)
weight_decay_values:
  # Very low regularization
  - 0.0
  - 0.001
  - 0.01
  
  # Medium regularization (typical for grokking)
  - 0.1
  - 0.5
  - 1.0
  
  # High regularization (from Nanda et al.)
  - 2.0
  - 5.0
  - 10.0

# Optimizers to test
optimizers:
  - muonw
  - adamw
  - sgd

# Paper-specific default hyperparameters
paper_configs:
  
  # Paper 3: Nanda et al. - Modular Addition
  nanda:
    p: 113
    train_fraction: 0.3
    d_model: 128
    n_heads: 4
    d_mlp: 512
    lr: 0.001
    n_epochs: 40000
    batch_size: null  # Full batch
    log_freq: 100
    checkpoint_freq: 1000
    spectral_freq: 100
    spectral_top_k: 20
    
  # Paper 5: Liu et al. - MNIST Grokking  
  mnist:
    train_points: 1000
    hidden_dim: 200
    depth: 3
    activation: 'relu'
    init_scale: 8.0
    lr: 0.001
    n_epochs: 100000
    batch_size: 200
    log_freq: 100
    checkpoint_freq: 5000
    spectral_freq: 100
    spectral_top_k: 20

# Optimizer-specific learning rate adjustments
# (some optimizers may need different LRs)
optimizer_lr_multipliers:
  muonw: 1.0
  adamw: 1.0
  sgd: 10.0  # SGD often needs higher LR

# Experiment naming convention
# Format: {paper}_{optimizer}_wd{weight_decay}_lr{lr}

