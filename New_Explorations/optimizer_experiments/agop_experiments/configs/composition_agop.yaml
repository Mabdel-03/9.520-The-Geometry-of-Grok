# Configuration for Compositional Reasoning with AGOP tracking
# NOTE: This is a placeholder - full implementation needs proper knowledge graph generation

dataset:
  name: "composition_reasoning"
  n_entities: 50
  n_facts: 500
  train_fraction: 0.3
  vocab_size: 100

model:
  type: "SimpleCompositionTransformer"
  d_model: 128
  n_heads: 4
  n_layers: 2
  max_seq_len: 10

training:
  n_epochs: 100000
  log_freq: 100
  device: "cuda"
  seed: 42

optimizers:
  - name: "adamw"
    lr: 0.0001
    weight_decays: [0.01, 0.1, 0.5, 1.0]
  - name: "muon"
    lr: 0.0001
    weight_decays: [0.01, 0.1, 0.5, 1.0]
  - name: "sgd"
    lr: 0.001
    weight_decays: [0.01, 0.1, 0.5, 1.0]

agop:
  enabled: false  # Disabled for now - sequence models need adaptation
  freq: 100
  top_k: 20
  subsample: null

save:
  dir: "./results/agop_experiments/composition"

note: "Run LAST after other datasets. Full implementation requires proper knowledge graph generation."

